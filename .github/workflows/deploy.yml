name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/landing-page/**'
      - 'apps/poc-wordle/**'
      - 'packages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install TypeScript globally
        run: bun add -g typescript@5.9.2

      - name: Build packages
        run: bun run build

      - name: Build landing page
        working-directory: apps/landing-page
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://app.posthog.com' }}
          VITE_BASE_PATH: '/NSM-Framework/'
        run: bun run build

      - name: Build POC Wordle
        working-directory: apps/poc-wordle
        env:
          VITE_BASE_PATH: '/NSM-Framework/wordle/'
        run: bun run build

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp -r apps/landing-page/dist/* _site/
          mkdir -p _site/wordle
          cp -r apps/poc-wordle/dist/* _site/wordle/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Trigger workflow
